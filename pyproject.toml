# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidkit"
version = "0.2.1"
description = "Android-in-Linux device platform: containers, virtual sensors/GPS, human-like touch, anti-virtualization audit, MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DroidKit contributors" }]
keywords = ["android", "redroid", "uinput", "mcp", "automation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Nothing beyond the standard library is required to drive a device. These are
# only for packaging/development conveniences.
dev = ["pytest>=8"]

[project.scripts]
droidkit = "droidkit.cli:main"

[project.urls]
Repository = "https://github.com/citalopram-lw/droidkit"

[tool.setuptools]
packages = ["droidkit"]
