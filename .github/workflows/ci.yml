name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: byte-compile
        run: python -m compileall -q droidkit
      - name: cli smoke
        run: bash scripts/droidkit --version
      - name: module entry point
        run: python -m droidkit --version
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: module sources present
        run: test "$(find android/module/src -name '*.java' | wc -l)" -ge 5
